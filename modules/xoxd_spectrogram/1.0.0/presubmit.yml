matrix:
  platform:
    - debian11
    - ubuntu2204
    - macos
  bazel:
    - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@xoxd_spectrogram//:pkg"
    test_targets:
      - "@xoxd_spectrogram//:test"
      - "@xoxd_spectrogram//:typecheck"
